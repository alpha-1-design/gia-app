// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Kotlin version must stay in sync with the version the Capacitor plugin
// modules default to (org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20).
// NOTE: must be declared INSIDE buildscript{} — the buildscript block is
// evaluated before the rest of the script body, so a top-level ext {} is
// not visible when the classpath strings below are interpolated.
buildscript {
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Compose compiler plugin (bundled with Kotlin 2.x) — required by the
        // Glance home-screen widget (GIAAppWidget.kt) and GIAWidgetPlugin.kt.
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Project-level copy for the generated capacitor-cordova-android-plugins
// module, which reads rootProject.ext.kotlin_version.
ext {
    kotlin_version = '2.2.20'
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
