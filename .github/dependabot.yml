version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "direct"
        update-types: ["security"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "direct"
        update-types: ["security"]
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
