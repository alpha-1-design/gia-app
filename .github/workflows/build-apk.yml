name: Build APK

on:
  push:
    branches: [ "main", "staging" ]
    tags: [ 'v*.*.*.*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run build

      - name: Register QEMU for arm64 rootfs builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build preinstalled Alpine rootfs for terminal (Ubuntu optional)
        shell: bash
        run: |
          chmod +x scripts/create-rootfs-ci.sh
          USE_ARM64=1 bash scripts/create-rootfs-ci.sh
        env:
          DOCKER_BUILDKIT: 1
          # Alpine-only by default → small APK (~190MB). Set to 1 for Ubuntu too.
          BUILD_UBUNTU: 0

      - name: Verify terminal rootfs assets exist
        shell: bash
        run: |
          if [ -f android/app/src/main/assets/terminal/alpine-minirootfs.tar.gz ] && [ -f android/app/src/main/assets/terminal/proot ]; then
            echo "alpine-minirootfs.tar.gz: $(du -h android/app/src/main/assets/terminal/alpine-minirootfs.tar.gz | cut -f1)"
            echo "proot: $(du -h android/app/src/main/assets/terminal/proot | cut -f1)"
            gzip -t android/app/src/main/assets/terminal/alpine-minirootfs.tar.gz && echo "gzip OK"
            if [ -f android/app/src/main/assets/terminal/ubuntu-rootfs.tar.gz ]; then
              echo "ubuntu-rootfs.tar.gz: $(du -h android/app/src/main/assets/terminal/ubuntu-rootfs.tar.gz | cut -f1)"
              gzip -t android/app/src/main/assets/terminal/ubuntu-rootfs.tar.gz && echo "ubuntu gzip OK"
            else
              echo "NOTE: ubuntu-rootfs.tar.gz not bundled (BUILD_UBUNTU=0) — terminal uses Alpine"
            fi
          else
            echo "ERROR: terminal rootfs assets missing!" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      - name: Generate fresh gradle wrapper
        run: |
          echo "Downloading Gradle distribution to regenerate wrapper jar"
          GRADLE_VERSION=$(grep 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-//;s/-.*//')
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -o -q /tmp/gradle.zip -d /tmp/gradle
          cd android && /tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION}
          rm -rf /tmp/gradle /tmp/gradle.zip

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias gia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=GIA App, OU=GIA, O=alpha1studio, L=Kumasi, ST=Ashanti, C=GH"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GIA-debug-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GIA-release-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
