name: Build APK

on:
  push:
    branches: [ "main", "staging" ]
    tags: [ 'v*.*.*.*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npx cap sync android

      - name: Ensure gradle wrapper jar exists
        run: |
          chmod +x android/gradlew
          JAR="android/gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$JAR" ]; then
            echo "gradle-wrapper.jar missing — downloading"
            GRADLE_VERSION=$(grep 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-//;s/-.*//')
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle-bin.zip
            unzip -o -q /tmp/gradle-bin.zip -d /tmp/gradle
            cp "/tmp/gradle/gradle-${GRADLE_VERSION}/lib/gradle-wrapper-${GRADLE_VERSION}.jar" "$JAR"
            rm -rf /tmp/gradle /tmp/gradle-bin.zip
          fi

      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias gia -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=GIA App, OU=GIA, O=alpha1studio, L=Kumasi, ST=Ashanti, C=GH"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GIA-debug-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GIA-release-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
