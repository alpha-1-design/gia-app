name: Build APK

on:
  push:
    branches: [ "main", "staging" ]
    tags: [ 'v*.*.*.*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          # v4's default packages input is "tools platform-tools" — but the
          # legacy "tools" package (Android SDK Tools) has been removed from
          # Google's SDK repo entirely, so `sdkmanager tools` fails outright
          # with "Failed to find package 'tools'" (exit code 1), taking the
          # whole step down before Gradle ever runs. Gradle/AGP resolves the
          # actual platform + build-tools versions it needs on its own via
          # the SDK root this step sets up, so nothing here needs to be
          # pre-installed — skip it entirely.
          packages: ''

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      - name: Generate fresh gradle wrapper
        run: |
          echo "Downloading Gradle distribution to regenerate wrapper jar"
          GRADLE_VERSION=$(grep 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-//;s/-.*//')
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -o -q /tmp/gradle.zip -d /tmp/gradle
          cd android && /tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION}
          rm -rf /tmp/gradle /tmp/gradle.zip

      - name: Restore persistent release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            # Decode the one, permanent signing keystore stored as a repo
            # secret. Every prior release generated a brand-new throwaway
            # keystore in this step (`keytool -genkey` with no persistence),
            # so every single build was signed with a different certificate.
            # Android refuses to install an APK as an *update* over an
            # existing install unless the signing certificate matches — it
            # doesn't error loudly, it just silently declines, which is
            # exactly why "tap Install" produced a spinner that went nowhere
            # and the app stayed on its old version no matter how many times
            # this workflow ran. Reusing the same keystore every time is the
            # actual fix; nothing about the app or updater code was wrong.
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "Using persistent release keystore from repo secret"
          else
            # Fallback for forks/PRs that don't have access to the secret —
            # generates a working but throwaway keystore so the build still
            # succeeds. Real releases must never go out signed with this.
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias gia -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=GIA App, OU=GIA, O=alpha1studio, L=Kumasi, ST=Ashanti, C=GH"
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret available — used a throwaway keystore. This build must not be published as a real release."
          fi

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GIA-debug-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GIA-release-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
