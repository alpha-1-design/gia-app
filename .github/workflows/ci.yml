name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test + Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  android-compile:
    name: Android native compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Generate fresh gradle wrapper
        run: |
          GRADLE_VERSION=$(grep 'distributionUrl' android/gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-//;s/-.*//')
          curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -o -q /tmp/gradle.zip -d /tmp/gradle
          cd android && /tmp/gradle/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION}
          rm -rf /tmp/gradle /tmp/gradle.zip
      - name: Compile Android Java
        run: cd android && ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace
